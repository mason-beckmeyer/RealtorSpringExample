spring:
  application:
    name: realtorDemo
  session:
    jdbc:
        initialize-schema: always
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
---
spring:
  config:
    activate:
      on-profile: local
  datasourceNew:
    url: jdbc:postgresql://localhost:5432/new_db_homes
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000

---
spring:
  config:
    activate:
      on-profile: local
  datasourceOld:
    url: jdbc:postgresql://localhost:5433/old_db_homes
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
---
spring:
  config:
    activate:
      on-profile: batch
  batch:
    job:
      enabled: true